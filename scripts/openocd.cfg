# Pico CMSIS-DAP SWD probe; the target must have its own 3.3 V supply.
# Loading this file does not program or reset. A flash command is a separate step.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
source [find target/stm32f1x.cfg]

# The Pico wiring has not been verified to include NRST. Do not assume a reset pin.
reset_config none
